<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System - Step 1 Complete</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            color: #00e676;
            margin-top: 0;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            line-height: 1.5;
        }
        .progress-bar {
            width: 100%;
            background-color: #333;
            border-radius: 6px;
            height: 10px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 50%;
            height: 100%;
            background-color: #00e676;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background-color: #ff9800;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            transition: background 0.2s ease;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #f57c00;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cyber Moder Key System</h2>
        <p>Step 1 of 2 completed successfully!</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <p>Click below to complete the final checkpoint and unlock your key.</p>
        
        <a id="step2-btn" class="btn" href="https://go.linkify.ru/2JgZ">PROCEED TO STEP 2</a>

    </div>
</body>
</html>
